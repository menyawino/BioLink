apiVersion: apps/v1
kind: Deployment
metadata:
  name: biolink-backend
  namespace: biolink
  labels:
    app: biolink-backend
    version: v1.2.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: biolink-backend
  template:
    metadata:
      labels:
        app: biolink-backend
        version: v1.2.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: biolink
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: biolinkpvw4jjqq.azurecr.io/biolink-backend:v1.2.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: biolink-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: biolink-secrets
                  key: database-url
            - name: RAG_PG_URL
              valueFrom:
                secretKeyRef:
                  name: biolink-secrets
                  key: rag-pg-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: biolink-secrets
                  key: secret-key
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: biolink-secrets
                  key: redis-url
            - name: SUPERSET_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: biolink-secrets
                  key: superset-admin-password
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: biolink-secrets
                  key: bootstrap-admin-password
            - name: AZURE_ENTRA_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: biolink-secrets
                  key: azure-entra-tenant-id
            - name: AZURE_ENTRA_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: biolink-secrets
                  key: azure-entra-client-id
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: etl-uploads
              mountPath: /shared/etl_uploads
      volumes:
        - name: tmp
          emptyDir: {}
        - name: etl-uploads
          persistentVolumeClaim:
            claimName: biolink-etl-uploads
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - biolink-backend
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: biolink-backend
  namespace: biolink
  labels:
    app: biolink-backend
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: http
      protocol: TCP
      name: http
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app: biolink-backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: biolink-backend-hpa
  namespace: biolink
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: biolink-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
