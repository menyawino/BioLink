apiVersion: apps/v1
kind: Deployment
metadata:
  name: biolink-frontend
  namespace: biolink
  labels:
    app: biolink-frontend
    version: v1.2.0
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: biolink-frontend
  template:
    metadata:
      labels:
        app: biolink-frontend
        version: v1.2.0
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
        - name: nginx
          image: biolinkpvw4jjqq.azurecr.io/biolink-frontend:v1.2.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: VITE_BACKEND_URL
              value: "https://api.biolink.myf.org"
            - name: VITE_SUPERSET_URL
              value: "https://analytics.biolink.myf.org"
            - name: VITE_NIFI_URL
              value: ""
            - name: VITE_OLLAMA_BASE_URL
              value: ""
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: biolink-nginx-config
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - biolink-frontend
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: biolink-frontend
  namespace: biolink
  labels:
    app: biolink-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: biolink-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: biolink-ingress
  namespace: biolink
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
    - hosts:
        - biolink.myf.org
        - api.biolink.myf.org
        - analytics.biolink.myf.org
      secretName: biolink-tls
  rules:
    - host: biolink.myf.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: biolink-frontend
                port:
                  number: 80
    - host: api.biolink.myf.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: biolink-backend
                port:
                  number: 3001
