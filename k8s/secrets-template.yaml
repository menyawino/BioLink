# BioLink Kubernetes Secrets Template
# 
# IMPORTANT: This is a TEMPLATE. Do NOT apply this file directly.
# Generate real secrets and apply them using:
#
#   kubectl create secret generic biolink-secrets \
#     --from-literal=database-url='postgresql+psycopg2://...' \
#     --from-literal=secret-key='...' \
#     --namespace biolink
#
# Or use Azure Key Vault + Secrets Store CSI Driver for production.

apiVersion: v1
kind: Secret
metadata:
  name: biolink-secrets
  namespace: biolink
type: Opaque
stringData:
  # Database connections (use Azure Database for PostgreSQL in production)
  database-url: "postgresql+psycopg2://USER:PASSWORD@HOST:5432/biolink?sslmode=require"
  rag-pg-url: "postgresql://USER:PASSWORD@HOST:5432/biolink_vector?sslmode=require"
  
  # PostgreSQL (if running in-cluster)
  postgres-user: "biolink"
  postgres-password: "GENERATE_STRONG_PASSWORD"
  
  # Redis
  redis-url: "redis://:PASSWORD@biolink-redis:6379/0"
  redis-password: "GENERATE_STRONG_PASSWORD"
  
  # Application secrets
  secret-key: "GENERATE_WITH: openssl rand -hex 32"
  superset-admin-password: "GENERATE_STRONG_PASSWORD"
  bootstrap-admin-password: "GENERATE_STRONG_PASSWORD"
  
  # Azure Entra ID
  azure-entra-tenant-id: "YOUR_TENANT_ID"
  azure-entra-client-id: "YOUR_CLIENT_ID"
  
  # Azure Storage (for backups)
  azure-storage-account: "biolinkbackups"
---
# Service Account for workload identity (Azure AD pod identity)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: biolink
  namespace: biolink
  annotations:
    azure.workload.identity/client-id: "YOUR_MANAGED_IDENTITY_CLIENT_ID"
---
# Network Policy — restrict pod-to-pod communication
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: biolink-backend-policy
  namespace: biolink
spec:
  podSelector:
    matchLabels:
      app: biolink-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: biolink-frontend
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3001
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: biolink-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: biolink-redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: biolink-pgvector
      ports:
        - protocol: TCP
          port: 5432
    # DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
---
# Pod Disruption Budget for high availability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: biolink-backend-pdb
  namespace: biolink
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: biolink-backend
