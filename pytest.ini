[pytest]
minversion = 7.0
testpaths = backend-py/tests
addopts = -q
filterwarnings =
	ignore:The 'app' shortcut is now deprecated\. Use the explicit style 'transport=WSGITransport\(app=\.\.\.\)' instead\.:DeprecationWarning:httpx\._client
markers =
	integration: marks tests that require cross-component or external service integration
