services:
  postgres:
    image: postgres:16-alpine
    container_name: biolink-postgres
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biolink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biolink_secret}
      POSTGRES_DB: ${POSTGRES_DB:-biolink}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biolink -d biolink -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: biolink-pgvector
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${PGVECTOR_USER:-biolink}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-biolink_secret}
      POSTGRES_DB: ${PGVECTOR_DB:-biolink_vector}
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biolink -d biolink_vector -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: biolink-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: biolink-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "q1Sh-9_ISia_zwGINzR9nA"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
    profiles:
      - optional

  connect:
    image: debezium/connect:2.6
    container_name: biolink-debezium
    depends_on:
      - kafka
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_connect_configs
      OFFSET_STORAGE_TOPIC: debezium_connect_offsets
      STATUS_STORAGE_TOPIC: debezium_connect_statuses
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      ENABLE_DEBEZIUM_SCRIPTING: "true"
    profiles:
      - optional

  ollama:
    image: ollama/ollama:latest
    container_name: biolink-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - optional

  backend:
    build:
      context: ./backend-py
      dockerfile: Dockerfile
    container_name: biolink-backend
    env_file:
      - ./backend-py/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      ETL_UPLOAD_WRITE_DIR: /shared/etl_uploads
      ETL_UPLOAD_READ_DIR: /shared/etl_uploads
      REGISTRY_SNAPSHOT_PATH: /app/outputs/unified_registry.csv
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://biolink:biolink_secret@postgres:5432/biolink
      RAG_PG_URL: postgresql://biolink:biolink_secret@pgvector:5432/biolink_vector
      OLLAMA_BASE_URL: http://ollama:11434
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-a-long-random-string}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ./db:/app/db
      - ./outputs:/app/outputs
      - etl_uploads:/shared/etl_uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://localhost:3001/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-}
        VITE_OLLAMA_BASE_URL: ${VITE_OLLAMA_BASE_URL:-}
        VITE_OLLAMA_MODEL: llama3.2:3b
        VITE_OLLAMA_TOOL_MODEL: llama3.2:3b
        VITE_OLLAMA_TOOL_MODEL_FALLBACK: llama3.2:3b
        VITE_SQL_AGENT_ENABLED: "true"
        VITE_SUPERSET_URL: ${VITE_SUPERSET_URL:-}
        VITE_SUPERSET_DASHBOARD_ID: "biolink-verification-dashboard"
        VITE_NIFI_URL: ${VITE_NIFI_URL:-}
    container_name: biolink-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://localhost/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend-dev:
    image: node:20-alpine
    container_name: biolink-frontend-dev
    working_dir: /app
    depends_on:
      - backend
    environment:
      VITE_BACKEND_URL: http://localhost:3001
      VITE_OLLAMA_BASE_URL: http://localhost:11434
      VITE_OLLAMA_MODEL: llama3.2:3b
      VITE_OLLAMA_TOOL_MODEL: llama3.2:3b
      VITE_OLLAMA_TOOL_MODEL_FALLBACK: llama3.2:3b
      VITE_SQL_AGENT_ENABLED: "true"
      VITE_SUPERSET_URL: http://localhost:8088
      VITE_SUPERSET_DASHBOARD_ID: "biolink-verification-dashboard"
      VITE_NIFI_URL: /nifi/
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./:/app
      - frontend_dev_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://localhost:5173 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    profiles:
      - dev

  mcp:
    image: node:20-alpine
    container_name: biolink-mcp
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run mcp:server"
    depends_on:
      - backend
    profiles:
      - optional

  superset:
    build:
      context: .
      dockerfile: docker/Dockerfile.superset
    container_name: biolink-superset
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-biolink-superset-secret}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@biolink.local}
      SUPERSET_ADMIN_FIRSTNAME: ${SUPERSET_ADMIN_FIRSTNAME:-Bio}
      SUPERSET_ADMIN_LASTNAME: ${SUPERSET_ADMIN_LASTNAME:-Link}
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      # BioLink PostgreSQL connection for superset_init.py
      BIOLINK_PG_HOST: postgres
      BIOLINK_PG_PORT: "5432"
      BIOLINK_PG_DB: biolink
      BIOLINK_PG_USER: biolink
      BIOLINK_PG_PASSWORD: ${POSTGRES_PASSWORD:-biolink_secret}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
      SUPERSET_EMBEDDED_ALLOWED_DOMAINS: ${SUPERSET_EMBEDDED_ALLOWED_DOMAINS:-}
      SUPERSET_METADATA_DATABASE_URI: ${SUPERSET_METADATA_DATABASE_URI:-postgresql+psycopg2://biolink:biolink_secret@postgres:5432/biolink}
      SUPERSET_METADATA_SCHEMA: ${SUPERSET_METADATA_SCHEMA:-superset_meta}
      SUPERSET_RATELIMIT_STORAGE_URI: ${SUPERSET_RATELIMIT_STORAGE_URI:-redis://redis:6379/1}
      SUPERSET_VERIFICATION_DASHBOARD_TITLE: "${SUPERSET_VERIFICATION_DASHBOARD_TITLE:-BioLink Verification Dashboard}"
      SUPERSET_VERIFICATION_DASHBOARD_SLUG: ${SUPERSET_VERIFICATION_DASHBOARD_SLUG:-biolink-verification-dashboard}
    ports:
      - "8088:8088"
    volumes:
      - superset_home:/app/superset_home
      - ./config/superset/superset_config.py:/app/superset_config.py:ro
      - ./config/superset/superset_init.py:/app/superset_init.py:ro
      - ./src/assets/BioLink_Visualize.png:/app/superset/static/assets/biolink-logo.png:ro
      - ./src/assets/BioLink_Visualize.png:/app/superset/static/assets/images/superset-logo-horiz.png:ro
      - ./src/assets/BioLink_Visualize.png:/app/superset/static/assets/images/superset.png:ro
      - ./src/assets/BioLink_Visualize.png:/app/superset/static/assets/images/favicon.png:ro
      - ./src/assets/BioLink_Visualize.png:/app/superset/static/assets/images/custom_logo.png:ro
      - ./src/assets/BioLink_Visualize.png:/app/superset/static/assets/images/custom_img_favicon.png:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        set -e
        /app/.venv/bin/python - <<'PY'
        import os

        from sqlalchemy import create_engine, text

        metadata_uri = os.getenv("SUPERSET_METADATA_DATABASE_URI", "").strip()
        metadata_schema = os.getenv("SUPERSET_METADATA_SCHEMA", "").strip()

        if metadata_uri and metadata_schema:
            engine = create_engine(metadata_uri, pool_pre_ping=True)
            quoted_schema = metadata_schema.replace('"', '""')
            with engine.begin() as connection:
                connection.execute(text(f'CREATE SCHEMA IF NOT EXISTS "{quoted_schema}"'))
            engine.dispose()
        PY
        superset db upgrade
        superset fab create-admin \
          --username "$${SUPERSET_ADMIN_USER}" \
          --firstname "$${SUPERSET_ADMIN_FIRSTNAME}" \
          --lastname "$${SUPERSET_ADMIN_LASTNAME}" \
          --email "$${SUPERSET_ADMIN_EMAIL}" \
          --password "$${SUPERSET_ADMIN_PASSWORD}" || true
        superset init
        /app/.venv/bin/python /app/superset_init.py
        exec /app/.venv/bin/gunicorn \
          --bind 0.0.0.0:8088 \
          --workers "$${SUPERSET_GUNICORN_WORKERS:-2}" \
          --worker-class gthread \
          --threads "$${SUPERSET_GUNICORN_THREADS:-8}" \
          --timeout "$${SUPERSET_GUNICORN_TIMEOUT:-120}" \
          "superset.app:create_app()"
    profiles:
      - optional

  nifi:
    build:
      context: .
      dockerfile: docker/Dockerfile.nifi
    container_name: biolink-nifi
    hostname: nifi
    environment:
      # --- NiFi 2.x single-user auth (HTTPS) ---
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USERNAME:-admin}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD}
      NIFI_WEB_HTTPS_HOST: nifi
      NIFI_WEB_PROXY_HOST: localhost:8443,127.0.0.1:8443,localhost:3000,frontend,frontend:80
      NIFI_JVM_HEAP_INIT: 2g
      NIFI_JVM_HEAP_MAX: 4g
      NIFI_SENSITIVE_PROPS_KEY: biolink_nifi_sensitive_key_456
      # --- NiFi flow configuration (initial load for new deployments) ---
      # --- Python extensions ---
      NIFI_PYTHON_EXTENSIONS_SOURCE_DIRECTORY_DEFAULT: /opt/nifi/nifi-current/python_extensions
      # --- Database connection settings ---
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: biolink
      DB_USER: biolink
      DB_PASSWORD: ${POSTGRES_PASSWORD:-biolink_secret}
      DB_URL: jdbc:postgresql://postgres:5432/biolink
      # --- JDBC driver ---
      NIFI_DBCP_DRIVER_PATH: /opt/nifi/jdbc/postgresql-42.7.3.jar
      # --- ETL settings ---
      ETL_UPLOAD_DIR: /etl-uploads
    ports:
      - "8443:8443"
      - "6342:6342"  # NiFi site-to-site
    volumes:
      # Persistent state
      - nifi_data:/opt/nifi/nifi-current/state
      - nifi_logs:/opt/nifi/nifi-current/logs
      # Full repo mount so NiFi can execute the script-based ETL directly
      - ./:/opt/nifi/biolink_repo
      # Python processors (NiFi 2.x native support)
      - ./nifi/processors:/opt/nifi/nifi-current/python_extensions
      # JDBC driver
      - ./nifi/jdbc:/opt/nifi/jdbc:ro
      # Shared uploads
      - etl_uploads:/etl-uploads
      # Source data (read-only reference)
      - ./db:/opt/nifi/db:ro
      # Schema CSV for BiolinkSchemaStandardizerProcessor
      # (column maps are now Python modules in nifi/processors/ — no CSV mount needed)
      # Flow definition (initial load for this environment)
      - ./nifi/flow/flow.json:/opt/nifi/nifi-current/conf/flow.json:ro
      # Chunked CSV input (writable for GetFile)
      - ./nifi/data-input:/opt/nifi/data-input
      # Shared outputs directory for the active db/test pipeline
      - ./outputs:/opt/nifi/outputs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "TOKEN=$$(curl -sk -X POST https://nifi:8443/nifi-api/access/token -d \"username=$${NIFI_USERNAME:-admin}&password=$${NIFI_PASSWORD}\" -H 'Content-Type: application/x-www-form-urlencoded') && curl -kf -H \"Authorization: Bearer $$TOKEN\" https://nifi:8443/nifi-api/system-diagnostics"]
      interval: 30s
      timeout: 15s
      retries: 15
      start_period: 120s

  nifi-bootstrap:
    image: python:3.12-alpine
    container_name: biolink-nifi-bootstrap
    depends_on:
      nifi:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./:/app
    command:
      - /bin/sh
      - -c
      - |
        python3 /app/nifi/scripts/bootstrap_nifi_graph.py \
          --nifi-url https://nifi:8443 \
          --username "$${NIFI_USERNAME:-admin}" \
          --password "$${NIFI_PASSWORD}"
    restart: "no"

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: biolink-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    profiles:
      - tools

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: biolink-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@biolink.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
      - pgvector
    profiles:
      - tools

volumes:
  postgres_data:
  pgvector_data:
  ollama_data:
  frontend_dev_node_modules:
  superset_home:
  etl_uploads:
  redis_data:
  nifi_data:
  nifi_logs:
  pgadmin_data:
