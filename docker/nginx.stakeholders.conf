server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index stakeholders.html;

    location / {
        try_files $uri $uri/ /stakeholders.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}